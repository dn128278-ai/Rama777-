name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Any Zip File
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          # Unzip hone ke baad subfolder ke contents ko root par copy karein
          for dir in */; do
            if [ -f "${dir}package.json" ]; then
              cp -r "${dir}"* .
            fi
          done

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean & Install Dependencies
        run: |
          rm -f package-lock.json bun.lock
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Create Capacitor JSON Config
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          echo '{"appId": "com.rama.app", "appName": "RAMA777", "webDir": "dist"}' > capacitor.config.json

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAMA777-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
